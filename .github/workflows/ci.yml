name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install from the lockfile
        run: uv sync --frozen --all-extras --dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format check
        run: uv run --frozen ruff format --check .
      - name: Type check
        run: uv run --frozen mypy src
      - name: Offline tests (includes ban-list, docs links and vendored-skill checksums)
        run: uv run --frozen pytest -q -m "not render and not live"
      - name: Sandbox recipe embeds the current render lock
        run: uv run --frozen python scripts/sync_sandbox_recipe.py --check
      - name: Vendored skills match skills-lock.json
        run: uv run --frozen design-agent skills verify
      - name: MDA definition import smoke
        run: uv run --frozen python -c "import agent; print(agent.agent.config['name'])"
      - name: MDA compiles the project as it is (what `mda deploy` ships)
        run: uv run --frozen mda build .

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Build the sandbox image (the recipe probe runs inside the build)
        run: docker build -t design-agent-sandbox:local sandbox/
      - name: Install from the lockfile
        run: uv sync --frozen --all-extras --dev
      - name: Render smoke tests
        run: uv run --frozen pytest -q -m render
      - name: Scripted demo through the real graph
        run: uv run --frozen design-agent demo
      - name: Self-hosted image and compose file
        run: |
          docker build -f deploy/self-host/Dockerfile -t design-agent:ci .
          POSTGRES_PASSWORD=ci docker compose -f deploy/self-host/compose.yaml config -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts=--all \
            --redact=100 --no-banner --no-color
