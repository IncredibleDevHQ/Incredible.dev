name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Release checks (ban-list without pre-release exemptions)
        run: |
          uv sync --frozen --all-extras --dev
          DESIGN_AGENT_RELEASE_CHECK=1 uv run pytest -q tests/unit/test_public_hygiene.py
      - name: Build the wheel and sdist
        run: uv build
      - name: Cut the release notes
        # This version's own notes (docs/releases/<version>.md) where they are written, else its
        # section of CHANGELOG.md, else the changes not yet released.
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          notes = pathlib.Path(f"docs/releases/{version}.md")
          if notes.is_file():
              body = notes.read_text()
          else:
              text = pathlib.Path("CHANGELOG.md").read_text()
              section = re.search(rf"^## v?{re.escape(version)}\b.*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
              section = section or re.search(r"^## Unreleased\n(.*?)(?=^## |\Z)", text, re.S | re.M)
              body = section.group(1).strip() if section else "See CHANGELOG.md."
          pathlib.Path("RELEASE_NOTES.md").write_text(body)
          PY
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
