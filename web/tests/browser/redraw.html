<!doctype html><html lang="en"><meta charset="utf-8"><div id="root"></div>
<script type="module">
import React from "react";
import { createRoot } from "react-dom/client";
import { ApplyChanges } from "/src/components/episode/Tools.tsx";
import "/src/app.css";
const mode = location.search.slice(1);
const chapters = ["Opening", "Process"].map((question,i) => ({id:String(i), question, beats:[]}));
const units = Array.from({length:mode==="single"?1:6}, (_,i) => ({
  id:String(i),chapter:String(i%2),kind:"picture",kind_of_picture:"diagram",builder:"demo",
  shows:"Diagram of item "+(i+1),frames:[],picture:{status:"made",stale:true}
}));
if(mode==="mixed") units.push({...units[0],id:"new",picture:{status:"none"}});
const view = {id:"fixture",stage:{state:"ready"},units,settings:{writer:"demo"},waiting:[],approved:true,plan:{chapters}};
createRoot(document.querySelector("#root")).render(React.createElement(ApplyChanges,{view,run: fn=>fn(),busy:false}));
</script></html>
