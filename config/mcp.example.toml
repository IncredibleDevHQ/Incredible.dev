# MCP servers the agent may use, on every runtime (src/design_agent/tools/mcp.py). Copy to
# config/mcp.toml (Git-ignored) and uncomment what you want. docs/integrations.md walks through it.
# Names are lowercase letters and digits; tools are named `{server}_{tool}`.
#
# A server sends headers read from the host environment (`headers_env`: header -> env var). Header
# values never enter the sandbox.

# --- LangSmith managed tools -------------------------------------------------------------------

# Web search (Parallel), run by LangSmith. No credentials to set: it is sent your LANGSMITH_API_KEY.
# Outside GCP US, use your region's API host.
# [servers.parallel]
# url = "https://api.smith.langchain.com/v1/managed-tools/servers/parallel/mcp"

# --- Hosted integrations -----------------------------------------------------------------------

# GitHub: repositories, pull requests and issues (release notes, PR explainers). A personal access
# token, with GITHUB_MCP_AUTHORIZATION="Bearer <token>" in .env.
# [servers.github]
# url = "https://api.githubcopilot.com/mcp/"
# headers_env = { Authorization = "GITHUB_MCP_AUTHORIZATION" }

# --- Your own servers ---------------------------------------------------------------------------

# A server of your own, read-only docs search with a shared token:
# [servers.docs]
# url = "https://docs.example.com/mcp"
# transport = "http"                                # or "sse"
# headers_env = { Authorization = "DOCS_MCP_AUTHORIZATION" }
# include_tools = ["search"]
# timeout = 30
# always_shown = false
#
# A local app's own stdio server:
# [servers.notes]
# transport = "stdio"
# command = ["notes-app", "mcp"]
