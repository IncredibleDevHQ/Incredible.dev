# Example Studio: a fictional design studio made for this repository. CC0-1.0; see LICENSE.
name = "Example Studio"
description = "A small studio that makes calm, exact visuals for software teams."
voice = "Plain, warm and exact. Short sentences, concrete nouns, figures with units. We explain once and stop; we never hype."
license = "CC0-1.0"

