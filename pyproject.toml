[project]
name = "design-agent"
version = "0.1.0.dev0"
description = "On-brand design and motion from a chat thread. Built on Deep Agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["design", "motion", "deep-agents", "langchain", "hyperframes", "paper", "slack"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "managed-deepagents>=0.9.4,<0.10",
    "deepagents>=0.7.28,<0.8",
    # `langchain.mcp.MCPAdapter` is the MCP client MDA itself uses; the extra brings FastMCP.
    "langchain[mcp]>=1.4.6,<1.5",
    "langchain-core>=1.6.12,<1.7",
    "langgraph>=1.2.16,<1.3",
    "langsmith>=0.14.11,<0.15",
    # MDA builds install core dependencies only, so both default providers live here.
    "langchain-anthropic>=1.7.6,<2",
    "langchain-openai>=1.7.2,<2",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "click>=8.2,<9",
    # LangChain does not validate dict-form JSON schema tool arguments; the host guard does.
    "jsonschema>=4.23,<5",
    # Image clamp, contact sheets and the look tool's resize.
    "pillow>=12,<14",
    # Self-hosted API, Paper bridge and the optional local setup console.
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
    "python-multipart>=0.0.20,<1",
    # PEP 615: zoneinfo needs IANA time zone data on Windows.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/langchain-ai/design-agent"
Changelog = "https://github.com/langchain-ai/design-agent/blob/main/CHANGELOG.md"
Security = "https://github.com/langchain-ai/design-agent/blob/main/SECURITY.md"

[project.scripts]
design-agent = "design_agent.cli:main"

[project.optional-dependencies]
# Self-hosted path: Postgres persistence and the production ASGI server.
self-host = [
    "langgraph-checkpoint-postgres>=3.2,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "uvicorn[standard]>=0.35,<1",
]
slack = ["slack-bolt>=1.30,<2", "slack-sdk>=3.45,<4", "aiohttp>=3.9,<4"]
# Extra model providers. Each adds a `provider:` prefix for DESIGN_AGENT_MODEL.
google = ["langchain-google-genai>=4,<5"]
groq = ["langchain-groq>=1,<2"]
mistral = ["langchain-mistralai>=1,<2"]

[dependency-groups]
dev = [
    "mypy>=1.17,<3",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.mda]
python-version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "render: needs the sandbox image (docker); run by the CI render job",
    "live: calls a live provider; needs DESIGN_AGENT_LIVE_TESTS=1",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Vendored skills are never patched (skills-lock.json); tests/unit/test_skills_lock.py keeps this
# list equal to the lock's.
extend-exclude = [
  ".venv",
  ".mda",
  ".agents/skills/deep-agents-core",
  ".agents/skills/deep-agents-memory",
  ".agents/skills/deep-agents-orchestration",
  ".agents/skills/langsmith-dataset",
  ".agents/skills/langsmith-evaluator",
  ".agents/skills/managed-deep-agents",
  "skills/embedded-captions",
  "skills/faceless-explainer",
  "skills/general-video",
  "skills/hyperframes",
  "skills/hyperframes-animation",
  "skills/hyperframes-audio",
  "skills/hyperframes-cli",
  "skills/hyperframes-core",
  "skills/hyperframes-creative",
  "skills/hyperframes-keyframes",
  "skills/hyperframes-registry",
  "skills/langsmith-trace",
  "skills/media-use",
  "skills/motion-graphics",
  "skills/music-to-video",
  "skills/pr-to-video",
  "skills/remotion-to-hyperframes",
  "skills/slideshow",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "TID", "ARG", "S", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "S607", "ARG001", "ARG002", "ARG005"]
# Paths inside the sandbox container, not this host's temp directory.
"src/design_agent/runtime/sandbox/*" = ["S108"]
"src/design_agent/middleware/workspace.py" = ["S108"]
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
