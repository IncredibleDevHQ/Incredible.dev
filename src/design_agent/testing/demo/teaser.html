<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Example Studio 2.0 teaser</title>
    <link rel="stylesheet" href="tokens.css" />
    <script src="gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--brand-color-paper);
      }
      #stage {
        position: relative;
        box-sizing: border-box;
        width: 1920px;
        height: 1080px;
        padding: 120px 144px;
        color: var(--brand-color-ink);
        font-family: var(--brand-font-text);
      }
      .mark {
        position: absolute;
        top: 120px;
        left: 144px;
        width: 112px;
        height: 112px;
      }
      .headline {
        position: absolute;
        left: 144px;
        bottom: 404px;
        margin: 0;
        font-family: var(--brand-font-display);
        font-weight: var(--brand-weight-display);
        font-size: 176px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .horizon {
        position: absolute;
        left: 144px;
        right: 144px;
        bottom: 330px;
        height: var(--brand-stroke);
        background: var(--brand-color-signal);
        transform-origin: left center;
      }
      .line {
        position: absolute;
        left: 144px;
        bottom: 200px;
        margin: 0;
        font-size: 56px;
        line-height: 1.3;
        color: var(--brand-color-graphite);
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="main" data-start="0" data-duration="4" data-width="1920" data-height="1080">
      <img id="mark" class="mark clip" src="mark.svg" alt="Example Studio" data-start="0" data-duration="4" data-track-index="0" />
      <h1 id="headline" class="headline clip" data-start="0" data-duration="4" data-track-index="1">Example Studio 2.0</h1>
      <div id="horizon" class="horizon clip" data-start="0" data-duration="4" data-track-index="2"></div>
      <p id="line" class="line clip" data-start="0" data-duration="4" data-track-index="3">Every size, one pass.</p>
    </div>
    <script>
      gsap.set(".headline", { opacity: 0, y: 48 });
      gsap.set(".horizon", { scaleX: 0 });
      gsap.set(".line", { opacity: 0, y: 24 });
      const tl = gsap.timeline({ paused: true });
      tl.to(".headline", { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.2);
      tl.to(".horizon", { scaleX: 1, duration: 0.8, ease: "power2.inOut" }, 0.7);
      tl.to(".line", { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
