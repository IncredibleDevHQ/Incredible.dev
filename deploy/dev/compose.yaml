# Local development: MinIO, an S3-compatible store on this computer, for the raw footage a
# take is recorded as. Production keeps footage in S3; the code is the same, the address differs.
#
#   docker compose -f deploy/dev/compose.yaml up -d
#
# Then, in .env:
#
#   DESIGN_AGENT_FOOTAGE_BUCKET=footage
#   DESIGN_AGENT_S3_ENDPOINT=http://127.0.0.1:9400
#   AWS_ACCESS_KEY_ID=minioadmin          # MINIO_ROOT_USER below
#   AWS_SECRET_ACCESS_KEY=minioadmin      # MINIO_ROOT_PASSWORD below
#
# The bucket is made on the first take. The console is at http://127.0.0.1:9401. The ports are
# not MinIO's usual 9000 and 9001, which another project's store often holds; MINIO_PORT and
# MINIO_CONSOLE_PORT move them. The credentials are a development store's defaults: it
# listens on this computer only and must not be reached from anywhere else as it is.
name: design-agent-dev

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9400}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9401}:9001"
    volumes:
      - footage:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

volumes:
  footage:
