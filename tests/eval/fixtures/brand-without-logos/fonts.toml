# Families the brand renders with. `file` is relative to the repository root: open fonts live in
# fonts/ (baked into the sandbox), licensed fonts in Git-ignored private-fonts/. A required font
# that is missing or does not match its sha256 fails `doctor`, the stager and the deploy preflight.

[[fonts]]
family = "Fraunces"
weight = "100 900"
style = "normal"
file = "fonts/Fraunces-Variable.ttf"
sha256 = "177ff6c0f14e5550a3c624247cd1189611d4eb65d000b14944c63d967958abbb"
required = true
license = "OFL-1.1"

